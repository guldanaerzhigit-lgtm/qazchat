<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b"><title>QazChat — мессенджер</title>
<style>
:root{color-scheme:dark;--bg:#17212b;--panel:#202b36;--panel2:#263442;--line:#2d3b49;--text:#f3f6f9;--muted:#91a0ae;--blue:#55a9e8;--mine:#2b5278}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}.header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#5db9ef,#2688d3);font-size:23px;font-weight:800}.heading{flex:1;min-width:0}.heading h1{font-size:21px;line-height:1.2;margin:0;font-weight:750}.heading p{margin:3px 0 0;color:var(--muted);font-size:12px}.icon-btn{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:22px}.icon-btn:active,.row:active{background:var(--panel2)}.search{padding:12px 14px}.search input{width:100%;border:0;border-radius:13px;background:var(--panel);padding:12px 15px;color:var(--text);outline:0}.search input:focus{box-shadow:0 0 0 1px var(--blue)}.section-label{padding:4px 18px 8px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}.list{flex:1;overflow:auto;padding-bottom:12px}.row{display:flex;align-items:center;gap:13px;padding:11px 15px;min-height:79px;cursor:pointer}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;color:white;font-size:20px;font-weight:650;background:linear-gradient(145deg,#5a9ee0,#3972ad)}.a-green{background:linear-gradient(145deg,#5dbb8a,#27876c)}.a-orange{background:linear-gradient(145deg,#efb66d,#d47b4c)}.a-purple{background:linear-gradient(145deg,#ad8be8,#7758b4)}.a-pink{background:linear-gradient(145deg,#e78eb4,#a85f90)}.a-teal{background:linear-gradient(145deg,#56c4c8,#328e9d)}.details{flex:1;min-width:0;border-bottom:1px solid #253340;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:5px}.row:last-child .details{border-bottom:0}.titleline,.previewline{display:flex;align-items:center;gap:8px;min-width:0}.name{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.time{font-size:11px;color:var(--muted);white-space:nowrap}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.check{color:var(--blue)}.badge{font-size:11px;min-width:20px;padding:3px 6px;text-align:center;border-radius:12px;background:#516578;color:white;font-weight:750}.badge.blue{background:#258acb}.empty{padding:45px 25px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#1d2935;border-top:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:7px 2px;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:11px}.tab .ico{font-size:22px;line-height:1.2}.tab.active{color:var(--blue);background:#293b4c}.fab{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:55px;height:55px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:27px;box-shadow:0 5px 18px #0005}.view{position:absolute;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.view.show{display:flex}.chathead{height:64px;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#202b36;border-bottom:1px solid var(--line)}.chathead .avatar{width:43px;height:43px;font-size:17px}.chatperson{flex:1;min-width:0}.chatperson strong{display:block;font-size:15px}.chatperson small{color:var(--blue)}.messages{flex:1;overflow:auto;padding:18px 12px;background:radial-gradient(ellipse at top,#1d2a36,var(--bg) 65%)}.day{width:max-content;margin:0 auto 18px;padding:5px 12px;border-radius:15px;background:#2b3946;color:#c3cdd6;font-size:11px}.bubble{max-width:82%;width:max-content;margin:8px 0;padding:9px 11px 5px;border-radius:14px 14px 14px 4px;background:#273746;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--mine);border-radius:14px 14px 4px 14px}.bubble time{display:block;text-align:right;color:#b1c3d1;font-size:10px;margin-top:4px}.composer{display:flex;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#202b36}.composer input{flex:1;min-width:0;border:0;border-radius:22px;padding:12px 15px;background:#2a3947;color:var(--text);outline:0}.send{border:0;width:43px;height:43px;border-radius:50%;background:var(--blue);font-size:20px}.panelview{position:absolute;inset:0;z-index:4;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.panelview.show{display:flex}.panelhead{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}.panelbody{padding:18px;overflow:auto}.setting{padding:16px;background:var(--panel);border-radius:13px;margin-bottom:10px}.modal-bg{position:absolute;inset:0;z-index:10;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.modal{width:100%;max-width:390px;border-radius:18px;background:#243240;padding:21px;box-shadow:0 15px 45px #0006}.modal h2{font-size:20px;margin:0 0 8px}.modal p{color:var(--muted);font-size:13px}.modal input{width:100%;padding:12px;border:1px solid #465766;border-radius:11px;background:#17212b;color:white;margin:7px 0 16px;outline:0}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border:0;border-radius:10px;padding:10px 14px;background:#394a59}.actions .primary{background:#278fd0}.toast{position:absolute;z-index:12;bottom:100px;left:50%;transform:translateX(-50%);background:#e9f1f7;color:#17212b;padding:10px 15px;border-radius:18px;display:none;white-space:nowrap;font-size:13px}.toast.show{display:block}
@media(min-width:600px){body{padding:20px 0}.app{height:calc(100dvh - 40px);border:1px solid #2c3b49;border-radius:18px}.header{border-radius:18px 18px 0 0}.view,.panelview{border-radius:18px}}
</style></head>
<body><main class="app">
<header class="header"><div class="logo">Q</div><div class="heading"><h1>QazChat</h1><p>Простое общение рядом</p></div><button class="icon-btn" id="searchToggle" aria-label="Поиск">⌕</button><button class="icon-btn" id="menu" aria-label="Меню">⋮</button></header>
<div class="search"><input id="search" placeholder="Поиск по чатам" autocomplete="off"></div>
<div class="section-label" id="label">Недавние чаты</div><section class="list" id="list"></section>
<nav class="bottom"><button class="tab active" data-tab="chats"><span class="ico">▤</span>Чаты</button><button class="tab" data-tab="contacts"><span class="ico">♙</span>Контакты</button><button class="tab" data-tab="calls"><span class="ico">♧</span>Звонки</button><button class="tab" data-tab="settings"><span class="ico">⚙</span>Настройки</button></nav>
<button class="fab" id="new" aria-label="Создать чат">＋</button>
<section class="view" id="chat"><header class="chathead"><button class="icon-btn" id="back">‹</button><div class="avatar" id="chatAvatar">А</div><div class="chatperson"><strong id="chatName">Чат</strong><small id="chatStatus">демо-режим</small></div><button class="icon-btn" id="chatMenu">⋮</button></header><div class="messages" id="messages"></div><form class="composer" id="form"><button type="button" class="icon-btn" id="emoji">☺</button><input id="message" placeholder="Сообщение..." autocomplete="off"><button class="send" type="submit">➤</button></form></section>
<section class="panelview" id="panel"><header class="panelhead"><button class="icon-btn" id="panelBack">‹</button><span id="panelTitle">Контакты</span></header><div class="panelbody" id="panelBody"></div></section>
<div class="modal-bg" id="modalBg"><form class="modal" id="modal"><h2 id="modalTitle">Новый чат</h2><p id="modalDescription">Создай личный чат по логину или группу. Пока это демонстрационный макет.</p><input id="newName" required maxlength="50" placeholder="@username"><div class="actions"><button type="button" id="cancel">Отмена</button><button class="primary" type="submit">Создать</button></div></form></div><div class="toast" id="toast"></div>
</main>
<script>
const $=s=>document.querySelector(s);
let chats=[
{id:'1',name:'Аружан',avatar:'А',color:'a-pink',preview:'Сәлем! Қалайсың?',time:'14:22',unread:2,messages:[{text:'Сәлем! Қалайсың?',time:'14:20'},{text:'Жақсы, өзің ше?',time:'14:22',mine:true}]},
{id:'2',name:'Отбасы ❤️',avatar:'❤',color:'a-orange',preview:'Ана: Кешке келесіңдер ме?',time:'13:58',unread:3,group:true,messages:[{text:'Кешке келесіңдер ме?',time:'13:58',sender:'Ана'}]},
{id:'3',name:'Жұмыс тобы',avatar:'Ж',color:'a-green',preview:'Ертеңгі жиналыс 10:00-де',time:'12:41',group:true,messages:[{text:'Ертеңгі жиналыс 10:00-де',time:'12:41',sender:'Әріптес'}]},
{id:'4',name:'Данияр',avatar:'Д',color:'a-purple',preview:'Фото жіберді',time:'Кеше',messages:[{text:'Фото жіберді',time:'18:30'}]},
{id:'5',name:'QazChat жаңалықтары',avatar:'Q',color:'',preview:'Қош келдіңіз! Бұл әзірге макет.',time:'Дс',group:true,messages:[{text:'Қош келдіңіз! Бұл әзірге QazChat интерфейсінің демо-нұсқасы.',time:'09:00'}]}
];let active=null,tab='chats';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function render(){let q=$('#search').value.toLowerCase().trim();let data=chats.filter(c=>(c.name+' '+c.preview).toLowerCase().includes(q));$('#label').textContent=q?'Нәтижелер':'Недавние чаты';$('#list').innerHTML=data.length?data.map(c=>'<article class="row" data-id="'+c.id+'"><div class="avatar '+c.color+'">'+esc(c.avatar)+'</div><div class="details"><div class="titleline"><span class="name">'+esc(c.name)+'</span><span class="time">'+esc(c.time)+'</span></div><div class="previewline"><span class="preview">'+(c.lastMine?'<span class="check">✓✓ </span>':'')+esc(c.preview)+'</span>'+(c.unread?'<span class="badge '+(c.unread<10?'blue':'')+'">'+c.unread+'</span>':'')+'</div></div></article>').join(''):'<div class="empty"><b>Чаты не найдены</b>Попробуй другое имя или создай новый чат.</div>';document.querySelectorAll('.row').forEach(el=>el.onclick=()=>openChat(el.dataset.id))}
function openChat(id){active=chats.find(c=>c.id===id);if(!active)return;active.unread=0;$('#chatName').textContent=active.name;$('#chatAvatar').textContent=active.avatar;$('#chatAvatar').className='avatar '+active.color;$('#chatStatus').textContent=active.group?'группа · демо-режим':'демо-режим';$('#messages').innerHTML='<div class="day">Сегодня</div>'+active.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+(m.sender?'<b>'+esc(m.sender)+':</b> ':'')+esc(m.text)+'<time>'+esc(m.time)+(m.mine?' ✓✓':'')+'</time></div>').join('');$('#chat').classList.add('show');$('#messages').scrollTop=$('#messages').scrollHeight;render()}
$('#back').onclick=()=>$('#chat').classList.remove('show');
$('#form').onsubmit=e=>{e.preventDefault();let text=$('#message').value.trim();if(!text||!active)return;let time=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});active.messages.push({text,time,mine:true});active.preview=text;active.time=time;active.lastMine=true;$('#message').value='';openChat(active.id)};
$('#emoji').onclick=()=>{$('#message').value+='😊';$('#message').focus()};
$('#searchToggle').onclick=()=>{$('#search').focus();$('#search').scrollIntoView({block:'nearest'})};$('#search').oninput=render;
$('#menu').onclick=()=>showPanel('settings');$('#chatMenu').onclick=()=>toast('Дополнительные настройки появятся позже');
function showPanel(name){tab=name;$('#chat').classList.remove('show');$('#panel').classList.add('show');$('#panelTitle').textContent=name==='contacts'?'Контакты':name==='calls'?'Звонки':'Настройки';$('#panelBody').innerHTML=name==='contacts'?'<div class="setting"><b>Контакты</b><p>Здесь появятся пользователи и поиск по уникальному логину после подключения регистрации.</p><button id="findUser" style="border:0;border-radius:9px;padding:10px 13px;background:#278fd0;color:white">Найти пользователя</button></div>':name==='calls'?'<div class="empty"><b>Звонки</b>Голосовые и видеозвонки пока не подключены.</div>':'<div class="setting"><b>Язык</b><p>Қазақша / Русский</p></div><div class="setting"><b>Тема</b><p>Тёмная тема</p></div><div class="setting"><b>Аккаунт</b><p>Регистрация и профиль будут подключены на следующем этапе.</p></div><div class="setting"><b>О приложении</b><p>QazChat · демонстрационная версия</p></div>';let f=$('#findUser');if(f)f.onclick=()=>{closePanel();openModal()}}
function closePanel(){$('#panel').classList.remove('show');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='chats'));tab='chats'}
$('#panelBack').onclick=closePanel;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='chats'){closePanel()}else showPanel(b.dataset.tab)});
function openModal(){$('#newName').value='';$('#modalBg').classList.add('show');$('#newName').placeholder='@username немесе топ атауы';$('#newName').focus()}
$('#new').onclick=openModal;$('#cancel').onclick=()=>$('#modalBg').classList.remove('show');
$('#modal').onsubmit=e=>{e.preventDefault();let val=$('#newName').value.trim();if(!val)return;let isGroup=val[0]!=='@';let name=isGroup?val:val.slice(1);if(chats.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Бұл чат тізімде бар');return}let c={id:String(Date.now()),name,avatar:(name[0]||'Q').toUpperCase(),color:['a-green','a-purple','a-orange','a-teal'][chats.length%4],preview:'Чат макетте жасалды',time:'сейчас',group:isGroup,messages:[{text:'Бұл демонстрациялық чат. Нақты хабарламалар жұмыс істеуі үшін аккаунттар мен дерекқорды қосу керек.',time:'сейчас'}]};chats.unshift(c);$('#modalBg').classList.remove('show');$('#search').value='';render();openChat(c.id);toast('Чат добавлен в макет')};
render();
</script></body></html>
