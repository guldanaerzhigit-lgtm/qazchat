<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e2936"><title>QazChat</title>
<style>
:root{--bg:#1e2936;--panel:#1e2936;--text:#f3f6fa;--muted:#83909e;--line:#2a3644;--blue:#55a8e8;--chip:#293644;--mine:#2b5278;--soft:#24313f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Arial",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}.statusbar{height:24px;flex:none;padding:3px 22px 0;display:flex;justify-content:space-between;font-size:12px;color:#fff;letter-spacing:.2px}.topbar{height:70px;flex:none;display:flex;align-items:center;padding:0 18px;gap:18px}.brand-avatars{width:91px;display:flex;align-items:center;position:relative;flex:none}.brand-avatars span{width:49px;height:49px;border:3px solid var(--bg);border-radius:50%;display:grid;place-items:center;margin-right:-21px;font-weight:bold;background:linear-gradient(135deg,#57b7e8,#9bd77d);color:#fff;font-size:19px}.brand-avatars span:nth-child(2){background:linear-gradient(135deg,#f3c56d,#e78d75)}.brand-avatars span:nth-child(3){background:linear-gradient(135deg,#9fdc74,#3aab82)}.brand{font-size:29px;font-weight:750;letter-spacing:-.7px;flex:1}.top-icon{border:0;background:transparent;font-size:29px;width:36px;height:42px;padding:0}.chat-list{overflow-y:auto;flex:1;padding-bottom:5px;scrollbar-width:thin;scrollbar-color:#354455 transparent}.chat-row{height:119px;display:flex;align-items:center;padding:12px 17px;gap:21px;cursor:pointer}.chat-row:active{background:#263544}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;flex:none;color:white;font-size:32px;font-weight:500;background:#559ee8;overflow:hidden}.avatar.green{background:#5ebd53}.avatar.photo{font-size:35px;background:linear-gradient(135deg,#263b60,#5b79a4)}.avatar.pink{background:linear-gradient(135deg,#a66d94,#d7a8b5)}.avatar.white{background:#fff;color:#202b37}.chat-main{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:7px}.chat-title-line,.preview-line{display:flex;align-items:center;gap:8px;min-width:0}.chat-title{font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chat-time{font-size:14px;color:var(--muted);white-space:nowrap}.chat-preview{font-size:17px;line-height:1.35;color:#8996a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chat-preview.blue{color:#68b4f1}.verified{color:#66b7ed;font-size:17px}.checks{color:#64b8f0;font-size:19px;white-space:nowrap}.pin{font-size:12px;background:#293643;color:#8e9ba8;border-radius:16px;padding:4px 9px;white-space:nowrap}.badge{background:#4d6478;border-radius:18px;color:#fff;font-weight:700;padding:5px 10px;font-size:15px;white-space:nowrap}.badge.blue{background:#62b7ee}.muted-icon{color:#71808d;font-size:15px}.bottom-nav{height:91px;flex:none;margin:0 10px max(8px,env(safe-area-inset-bottom));border-radius:34px;background:#202f3f;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 8px 3px;z-index:3}.nav-item{border:0;background:transparent;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:17px;font-weight:600;position:relative}.nav-item .ico{font-size:30px;line-height:1}.nav-item.active{background:#263e55;color:#46a9f4}.nav-item .badge-small{position:absolute;top:5px;left:calc(50% + 1px);font-size:12px;font-weight:800;background:#168fe0;color:#fff;border:2px solid #263e55;border-radius:16px;padding:3px 6px}.fab{position:absolute;right:18px;bottom:calc(111px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:50%;background:#269ce7;color:white;font-size:33px;box-shadow:0 4px 18px #0003;z-index:4}.camera{position:absolute;right:18px;bottom:calc(184px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:#243546;color:white;font-size:27px;z-index:4}.search-panel{display:none;padding:0 17px 12px}.search-panel.show{display:block}.search-panel input{width:100%;border:1px solid #344252;border-radius:14px;padding:13px 15px;background:#263442;color:white;outline:none}.screen{position:absolute;inset:24px 0 0;background:var(--bg);z-index:8;display:none;flex-direction:column}.screen.show{display:flex}.screen-head{height:62px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);font-size:21px;font-weight:700}.back{border:0;background:transparent;font-size:28px}.chat-view{position:absolute;inset:24px 0 0;background:var(--bg);z-index:9;display:none;flex-direction:column}.chat-view.show{display:flex}.chat-head{display:flex;align-items:center;gap:13px;padding:10px 14px;height:72px;border-bottom:1px solid var(--line)}.chat-head .avatar{width:48px;height:48px;font-size:20px}.chat-head-info{flex:1;min-width:0}.chat-head-name{font-size:18px;font-weight:700}.chat-head-status{font-size:13px;color:var(--blue);margin-top:4px}.chat-actions{display:flex;gap:13px;font-size:24px}.messages{flex:1;overflow:auto;padding:18px 14px;background:linear-gradient(180deg,#1b2632,#1e2936)}.date-chip{margin:0 auto 18px;width:max-content;padding:6px 12px;border-radius:18px;background:#2a3846;color:#b5c0cb;font-size:12px}.msg{max-width:82%;width:max-content;margin:9px 0;padding:10px 12px 7px;border-radius:14px 14px 14px 4px;background:#293846;font-size:16px;line-height:1.4;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:#2b5278;border-radius:14px 14px 4px 14px}.msg-time{text-align:right;color:#a8b8c6;font-size:11px;margin-top:4px}.composer{display:flex;gap:10px;align-items:center;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#1e2936}.composer input{flex:1;min-width:0;background:#2a3745;border:0;border-radius:24px;padding:14px 17px;color:white;outline:none}.composer button{border:0;background:transparent;font-size:25px}.send{width:48px;height:48px;border-radius:50%!important;background:#269ce7!important;color:#fff}.modal-back{position:absolute;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:22px}.modal-back.show{display:flex}.modal{width:100%;max-width:400px;background:#263442;border:1px solid #344353;border-radius:20px;padding:23px}.modal h2{margin:0 0 8px;font-size:21px}.modal p{color:#aab5c0;font-size:14px;line-height:1.5}.modal input{width:100%;padding:13px;border:1px solid #465463;border-radius:12px;background:#1c2834;color:white;margin:8px 0 15px;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.modal-actions button{border:0;border-radius:12px;padding:11px 15px;background:#3a4a59}.modal-actions .primary{background:#269ce7}.toast{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);background:#e8eef4;color:#17212b;border-radius:18px;padding:11px 16px;white-space:nowrap;display:none;z-index:30;font-size:14px}.toast.show{display:block}
@media(min-width:650px){.app{max-width:560px;border-left:1px solid #2a3644;border-right:1px solid #2a3644}.chat-row{height:108px}.avatar{width:76px;height:76px}.chat-title{font-size:18px}.chat-preview{font-size:15px}}
</style></head><body><div class="app" id="app">
<div class="statusbar"><span id="clock">14:27</span><span>◢　◉　▣　4G+　▰ 87%</span></div>
<header class="topbar"><div class="brand-avatars"><span>Q</span><span>✦</span><span>А</span></div><div class="brand">QazChat</div><button class="top-icon" id="searchBtn" aria-label="Поиск">⌕</button><button class="top-icon" id="menuBtn" aria-label="Меню">⋮</button></header>
<div class="search-panel" id="searchPanel"><input id="searchInput" placeholder="Поиск чатов и сообщений"></div>
<main class="chat-list" id="chatList"></main>
<nav class="bottom-nav"><button class="nav-item active" data-tab="chats"><span class="ico">▣</span><span>Чаты</span><span class="badge-small">115</span></button><button class="nav-item" data-tab="contacts"><span class="ico">☻</span><span>Контакты</span></button><button class="nav-item" data-tab="settings"><span class="ico">⚙</span><span>Настройки</span></button><button class="nav-item" data-tab="profile"><span class="ico">◉</span><span>Профиль</span></button></nav>
<button class="camera" id="cameraBtn" aria-label="Камера">▣</button><button class="fab" id="newBtn" aria-label="Новое сообщение">✚</button>
<section class="screen" id="otherScreen"><header class="screen-head"><button class="back" id="screenBack">‹</button><span id="screenTitle">Контакты</span></header><div id="screenBody" style="padding:20px;color:#aeb8c4;line-height:1.6">Этот раздел появится в следующих версиях.</div></section>
<section class="chat-view" id="chatView"><header class="chat-head"><button class="back" id="chatBack">‹</button><div class="avatar blue" id="viewAvatar">А</div><div class="chat-head-info"><div class="chat-head-name" id="viewName">Александр</div><div class="chat-head-status" id="viewStatus">в сети</div></div><div class="chat-actions"><button id="viewSearch">⌕</button><button id="viewMore">⋮</button></div></header><div class="messages" id="messages"></div><form class="composer" id="composer"><button type="button" id="emojiBtn">☺</button><input id="messageInput" placeholder="Сообщение" autocomplete="off"><button type="button" id="attachBtn">＋</button><button class="send" type="submit">➤</button></form></section>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Новое сообщение</h2><p id="modalText">Начни личный чат по логину или создай группу.</p><form id="modalForm"><input id="modalInput" required placeholder="@username" maxlength="60"><div class="modal-actions"><button type="button" id="cancelBtn">Отмена</button><button class="primary" type="submit" id="confirmBtn">Продолжить</button></div></form></div></div><div class="toast" id="toast"></div></div>
<script>
var chats=[
{id:'1',name:'Cutter',type:'private',avatar:'C',style:'',preview:'/start',time:'10 февр.',pin:true,checks:true,unread:0,messages:[{text:'/start',time:'14:20',mine:true}]},
{id:'2',name:'WideStock JanRput',type:'private',avatar:'◎',style:'white',preview:'/start',time:'25.02.25',pin:true,checks:true,messages:[{text:'/start',time:'14:20',mine:true}]},
{id:'3',name:'НОВЫЙ канал',type:'group',avatar:'🌹',style:'pink',preview:'НОВЫЙ канал закрепил(а) «Көбіңіз абон а...',time:'03.04.24',pin:true,muted:true,blue:true,messages:[{text:'Добро пожаловать в канал!',time:'14:20'}]},
{id:'4',name:'ВИП БАННЕРЫ',type:'group',avatar:'✿',style:'pink',preview:'🖼️ 🖼️ 🖼️  4 фото',time:'15.12.24',pin:true,muted:true,blue:true,messages:[{text:'4 фото',time:'14:20'}]},
{id:'5',name:'Для себя епта',type:'private',avatar:'ДЛ',style:'green',preview:'@gigastock_bot',time:'03 авг.',pin:true,checks:true,messages:[{text:'@gigastock_bot',time:'14:20',mine:true}]},
{id:'6',name:'Работа в г. Аркалык',type:'group',avatar:'↗',style:'white',preview:'01Ast: Баня барма',time:'14:25',unread:4654,muted:true,messages:[{text:'Баня барма',time:'14:25',sender:'01Ast'}]},
{id:'7',name:'TRNDX.',type:'group',avatar:'T',style:'photo',preview:'🖼️ Фотограф Александр Баба...',time:'14:25',unread:4167,verified:true,messages:[{text:'Фотограф Александр',time:'14:25'}]},
{id:'8',name:'Распаковка Пинлудуло',type:'group',avatar:'Р',style:'photo',preview:'Ильдана: С весом за 5000 тг общ где...',time:'14:23',unread:381,messages:[{text:'С весом за 5000 тг общ где...',time:'14:23',sender:'Ильдана'}]},
{id:'9',name:'Ценная бумага',type:'group',avatar:'ЦБ',style:'white',preview:'📦 Мировые цены на дизель упали...',time:'14:23',unread:1970,messages:[{text:'Мировые цены на дизель упали',time:'14:23'}]},
{id:'10',name:'Даниил | AI-генератор',type:'private',avatar:'Д',style:'photo',preview:'Страх тебя тормозит ❗ Очень ча...',time:'14:22',unread:2,verified:true,messages:[{text:'Страх тебя тормозит',time:'14:22'}]},
{id:'11',name:'Барахолка г. Аркалык',type:'group',avatar:'Б',style:'green',preview:'Новое объявление',time:'14:18',unread:96,messages:[{text:'Новое объявление',time:'14:18'}]},
{id:'12',name:'Мария',type:'private',avatar:'М',style:'pink',preview:'Спасибо большое!',time:'Вчера',messages:[{text:'Спасибо большое!',time:'12:30'}]}
];var active=null;var tab='chats';function $(s){return document.querySelector(s)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function toast(s){var t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2300)}
function renderList(){var q=$('#searchInput').value.toLowerCase().trim();var list=chats.filter(function(c){return (c.name+' '+c.preview).toLowerCase().includes(q)});$('#chatList').innerHTML=list.map(function(c){return '<article class="chat-row" data-id="'+c.id+'"><div class="avatar '+(c.style||'')+'">'+esc(c.avatar)+'</div><div class="chat-main"><div class="chat-title-line"><div class="chat-title">'+esc(c.name)+(c.verified?' <span class="verified">✿</span>':'')+(c.muted?' <span class="muted-icon">◖</span>':'')+'</div><div class="chat-time">'+(c.checks?'<span class="checks">✓✓</span> ':'')+esc(c.time)+'</div></div><div class="preview-line"><div class="chat-preview '+(c.blue?'blue':'')+'">'+esc(c.preview)+'</div>'+(c.pin?'<span class="pin">◆ '+esc(c.time)+'</span>':'')+(c.unread?'<span class="badge '+(c.unread<100?'blue':'')+'">'+(c.unread>999?c.unread:c.unread)+'</span>':'')+'</div></div></article>'}).join('');document.querySelectorAll('.chat-row').forEach(function(el){el.onclick=function(){openChat(el.dataset.id)}})}
function openChat(id){active=chats.find(function(c){return c.id===id});if(!active)return;active.unread=0;$('#viewName').textContent=active.name;$('#viewAvatar').textContent=active.avatar;$('#viewAvatar').className='avatar '+(active.style||'');$('#viewStatus').textContent=active.type==='group'?'группа': 'был(а) недавно';$('#messages').innerHTML='<div class="date-chip">Сегодня</div>'+active.messages.map(function(m){return '<div class="msg '+(m.mine?'mine':'')+'">'+(m.sender?'<b>'+esc(m.sender)+':</b> ':'')+esc(m.text)+'<div class="msg-time">'+m.time+(m.mine?' ✓✓':'')+'</div></div>'}).join('');$('#chatView').classList.add('show');$('#messages').scrollTop=$('#messages').scrollHeight}
$('#chatBack').onclick=function(){$('#chatView').classList.remove('show');renderList()};$('#composer').onsubmit=function(e){e.preventDefault();var input=$('#messageInput'),text=input.value.trim();if(!text||!active)return;var time=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});active.messages.push({text:text,time:time,mine:true});active.preview=text;active.time=time;input.value='';openChat(active.id);renderList()};$('#searchBtn').onclick=function(){$('#searchPanel').classList.toggle('show');if($('#searchPanel').classList.contains('show'))$('#searchInput').focus()};$('#searchInput').oninput=renderList;$('#menuBtn').onclick=function(){toast('Меню настроек появится позже')};$('#cameraBtn').onclick=function(){toast('Камера и отправка фото будут добавлены позже')};$('#attachBtn').onclick=function(){toast('Файлы пока не подключены')};$('#emojiBtn').onclick=function(){$('#messageInput').value+='😊';$('#messageInput').focus()};$('#viewSearch').onclick=function(){var q=prompt('Поиск в чате');if(q)toast(active.messages.some(function(m){return m.text.toLowerCase().includes(q.toLowerCase())})?'Сообщение найдено':'Совпадений нет')};$('#viewMore').onclick=function(){toast('Настройки чата добавим позже')};$('#newBtn').onclick=function(){$('#modalTitle').textContent='Новое сообщение';$('#modalText').textContent='Введи логин пользователя или название новой группы.';$('#modalInput').placeholder='@username или название группы';$('#modalInput').value='';$('#modalBack').classList.add('show');$('#modalInput').focus()};$('#cancelBtn').onclick=function(){$('#modalBack').classList.remove('show')};$('#modalForm').onsubmit=function(e){e.preventDefault();var val=$('#modalInput').value.trim();if(!val)return;var group=val.charAt(0)!=='@'&&!val.includes('_')&&!val.includes('@');var c={id:String(Date.now()),name:group?val:val.replace(/^@/,''),type:group?'group':'private',avatar:(group?val:val.replace(/^@/,''))[0].toUpperCase(),style:'',preview:group?'Группа создана':'Новый чат',time:'сейчас',messages:[{text:group?'Группа создана в макете':'Это демонстрационный чат. Реальная отправка сообщений появится после подключения базы данных.',time:'сейчас'}]};chats.unshift(c);$('#modalBack').classList.remove('show');renderList();openChat(c.id);toast(group?'Группа создана в макете':'Чат создан в макете')};
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('active',x===b)});if(tab==='chats'){$('#otherScreen').classList.remove('show');$('#chatView').classList.remove('show');$('#chatList').style.display='block';$('#searchPanel').style.display=''}else{$('#chatView').classList.remove('show');$('#otherScreen').classList.add('show');$('#screenTitle').textContent=tab==='contacts'?'Контакты':tab==='settings'?'Настройки':'Профиль';$('#screenBody').textContent=tab==='contacts'?'Здесь появятся пользователи, поиск по логину и список контактов.':tab==='settings'?'Здесь будут язык, тема, уведомления и настройки приватности.':'Профиль пользователя: имя, уникальный логин и аватар.'}}});$('#screenBack').onclick=function(){$('#otherScreen').classList.remove('show');document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('active',x.dataset.tab==='chats')});tab='chats'};renderList();
</script></body></html>
