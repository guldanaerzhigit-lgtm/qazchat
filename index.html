<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5865f2"><title>QazChat — макет мессенджера</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#20243a;--muted:#8990a5;--line:#e9ecf4;--primary:#5865f2;--bubble:#eef0ff;--soft:#f7f8fc;--green:#28b985}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:1440px;height:100vh;margin:auto;padding:16px;display:grid;grid-template-columns:68px 310px minmax(0,1fr);gap:12px}.rail,.sidebar,.conversation{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:0}.rail{padding:15px 8px;display:flex;align-items:center;flex-direction:column;gap:12px}.brand{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#7480ff,#5059df);color:white;display:grid;place-items:center;font-size:23px;font-weight:800;margin-bottom:14px}.rail-btn{width:44px;height:44px;border:0;background:transparent;border-radius:14px;color:#969bb0;font-size:20px}.rail-btn.active,.rail-btn:hover{background:var(--bubble);color:var(--primary)}.rail-bottom{margin-top:auto}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:750;flex-shrink:0;background:linear-gradient(135deg,#ffb36d,#ed7a8b)}.blue{background:linear-gradient(135deg,#70a9ff,#6574e8)}.green{background:linear-gradient(135deg,#62d8b4,#229f9b)}.purple{background:linear-gradient(135deg,#bd91ff,#7b69d9)}.yellow{background:linear-gradient(135deg,#f5d36b,#eaa44b)}.sidebar{padding:22px 14px;display:flex;flex-direction:column;overflow:hidden}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo-title{font-weight:850;font-size:23px}.logo-title span{color:var(--primary)}.round-btn{width:40px;height:40px;border:0;border-radius:14px;background:var(--bubble);color:var(--primary);font-size:22px}.search{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;gap:8px;align-items:center;color:var(--muted);margin-bottom:15px}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}.filters{display:flex;gap:7px;margin-bottom:12px}.filter{border:1px solid var(--line);background:white;color:var(--muted);padding:8px 11px;border-radius:10px;font-size:12px}.filter.active{background:var(--primary);border-color:var(--primary);color:white}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin:7px 5px 10px;display:flex;justify-content:space-between}.chat-list{overflow:auto;min-height:0}.chat-item{width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:11px 9px;border:0;background:transparent;border-radius:15px;color:inherit;margin-bottom:4px}.chat-item:hover,.chat-item.active{background:var(--soft)}.chat-item.active{box-shadow:inset 3px 0 var(--primary)}.chat-info{min-width:0;flex:1}.chat-top{display:flex;justify-content:space-between;gap:5px;align-items:center}.chat-name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;background:var(--primary);color:white;border-radius:9px;font-size:10px;font-weight:800}.conversation{display:flex;flex-direction:column;overflow:hidden}.conv-head{padding:17px 23px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.conv-person{flex:1;min-width:0}.conv-name{font-weight:800;font-size:16px}.online{font-size:12px;color:var(--green);margin-top:4px}.head-actions{display:flex;gap:8px}.icon-btn{width:39px;height:39px;border:1px solid var(--line);background:white;border-radius:12px;color:#7d849b;font-size:17px}.messages{flex:1;overflow:auto;padding:25px clamp(16px,5vw,70px);background:radial-gradient(ellipse at 50% 0%,#f7f8ff 0,transparent 65%)}.day-label{text-align:center;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:20px;width:max-content;margin:0 auto 24px}.message-row{display:flex;gap:9px;margin:14px 0;align-items:flex-end}.message-row.mine{justify-content:flex-end}.mini-avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:white;font-size:11px;font-weight:800;flex-shrink:0}.message-content{max-width:min(75%,520px)}.sender{font-size:11px;color:var(--muted);margin:0 0 5px 4px}.bubble{padding:11px 14px;border-radius:17px 17px 17px 5px;background:white;border:1px solid var(--line);font-size:14px;line-height:1.5;overflow-wrap:anywhere}.mine .bubble{background:var(--primary);color:white;border-color:var(--primary);border-radius:17px 17px 5px 17px}.msg-meta{text-align:right;color:var(--muted);font-size:10px;margin:5px 4px 0}.mine .msg-meta{color:#a2a8ff}.composer-wrap{padding:13px 22px 18px;border-top:1px solid var(--line);background:#fff}.composer{display:flex;gap:9px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:7px}.attach{width:38px;height:38px;border:0;background:transparent;color:var(--muted);font-size:20px}.composer input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:10px 2px;color:var(--text)}.send{width:41px;height:41px;border:0;border-radius:13px;background:var(--primary);color:white;font-size:19px}.hint{text-align:center;color:#a3a8b9;font-size:10px;margin-top:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#242943;color:white;padding:12px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{display:none;position:fixed;inset:0;background:#14172c66;z-index:20;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{background:white;width:min(420px,100%);padding:24px;border-radius:22px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted);line-height:1.5}.field{display:block;margin:15px 0}.field span{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.btn{padding:11px 15px;border-radius:11px;border:1px solid var(--line);background:white}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.mobile-top{display:none}body.dark{--bg:#111421;--panel:#191d2d;--text:#edf0ff;--muted:#9299b2;--line:#2b3045;--bubble:#292d4b;--soft:#202438}body.dark .filter,body.dark .icon-btn,body.dark .bubble,body.dark .modal,body.dark .day-label{background:#202438;color:var(--text);border-color:var(--line)}body.dark .mine .bubble{background:var(--primary)}body.dark .composer-wrap{background:var(--panel)}body.dark .messages{background:radial-gradient(ellipse at 50% 0%,#20243b 0,transparent 65%)}body.dark .field input{background:#202438;color:var(--text)}body.dark .round-btn{background:var(--bubble)}@media(max-width:900px){.app{grid-template-columns:58px 270px minmax(0,1fr);padding:9px;gap:8px}.rail{padding:12px 6px}.sidebar{padding:18px 10px}}@media(max-width:650px){body{height:100dvh}.app{height:100dvh;padding:0;display:block}.rail{position:fixed;z-index:5;bottom:0;left:0;right:0;height:64px;border-radius:17px 17px 0 0;display:flex;flex-direction:row;justify-content:space-around;padding:8px 12px;gap:8px}.brand{display:none}.rail-btn{width:44px;height:44px}.rail-bottom{margin:0}.sidebar{height:calc(100dvh - 64px);border-radius:0;border:0;padding:19px 14px}.conversation{display:none;position:fixed;inset:0 0 64px 0;border-radius:0;border:0;z-index:4}.conversation.mobile-open{display:flex}.app.chat-mode .sidebar{display:none}.app.chat-mode .conversation{display:flex}.app.chat-mode .rail{z-index:6}.mobile-top{display:inline-block}.conv-head{padding:12px}.messages{padding:18px 12px}.composer-wrap{padding:9px 11px 12px}.message-content{max-width:83%}.head-actions .icon-btn:nth-child(2){display:none}}
</style></head><body><div class="app" id="app">
<nav class="rail"><div class="brand">Q</div><button class="rail-btn active" data-section="all" title="Чаты">▤</button><button class="rail-btn" data-section="private" title="Личные">♙</button><button class="rail-btn" data-section="group" title="Группы">♧</button><button class="rail-btn" id="settingsBtn" title="Настройки">⚙</button><button class="rail-btn rail-bottom" id="themeBtn" title="Тема">☾</button></nav>
<aside class="sidebar"><div class="side-head"><div class="logo-title">Qaz<span>Chat</span></div><button class="round-btn" id="newBtn" title="Новый чат или группа">＋</button></div><label class="search">⌕ <input id="search" placeholder="Поиск чатов и людей"></label><div class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="private">Личные</button><button class="filter" data-filter="group">Группы</button></div><div class="section-title"><span>Недавние чаты</span><span id="count">5</span></div><div class="chat-list" id="chatList"></div></aside>
<main class="conversation" id="conversation"><header class="conv-head"><button class="icon-btn mobile-top" id="backBtn">‹</button><div class="avatar blue" id="activeAvatar">А</div><div class="conv-person"><div class="conv-name" id="activeName">Александр</div><div class="online" id="activeStatus">● в сети</div></div><div class="head-actions"><button class="icon-btn" id="findBtn" title="Поиск в чате">⌕</button><button class="icon-btn" id="infoBtn" title="Информация">ⓘ</button><button class="icon-btn" id="moreBtn" title="Ещё">⋯</button></div></header><div class="messages" id="messages"><div class="day-label">Сегодня</div></div><div class="composer-wrap"><form class="composer" id="messageForm"><button type="button" class="attach" id="attachBtn" title="Файлы пока не подключены">＋</button><input id="messageInput" placeholder="Написать сообщение..." autocomplete="off"><button class="send" type="submit">➤</button></form><div class="hint">QazChat · интерактивный макет · демо-сообщения не отправляются другим людям</div></div></main></div>
<div class="toast" id="toast"></div><div class="modal-backdrop" id="backdrop"><div class="modal"><h2 id="modalTitle">Создать</h2><p id="modalDesc"></p><form id="modalForm"><div id="fields"></div><div class="modal-actions"><button class="btn" type="button" id="cancelBtn">Отмена</button><button class="btn primary" type="submit" id="submitBtn">Создать</button></div></form></div></div>
<script>
var $=function(s){return document.querySelector(s)};var chats=[
{id:'1',name:'Александр',username:'@alex_1995',type:'private',avatar:'А',color:'blue',online:true,preview:'Хорошо, договорились!',time:'14:08',unread:2,messages:[{from:'them',text:'Привет! Как дела?',time:'14:01'},{from:'mine',text:'Привет! Всё отлично 😊',time:'14:03'},{from:'them',text:'На выходных увидимся?',time:'14:06'},{from:'mine',text:'Хорошо, договорились!',time:'14:08'}]},
{id:'2',name:'Семья ❤️',type:'group',avatar:'❤',color:'purple',preview:'Мама: Не забудьте купить хлеб',time:'13:52',unread:3,messages:[{from:'them',sender:'Мама',text:'Всем привет! Как дела?',time:'13:45'},{from:'them',sender:'Папа',text:'Всё хорошо 👍',time:'13:48'},{from:'them',sender:'Мама',text:'Не забудьте купить хлеб',time:'13:52'}]},
{id:'3',name:'Мария',username:'@maria_kz',type:'private',avatar:'М',color:'green',online:true,preview:'Спасибо большое!',time:'12:30',unread:0,messages:[{from:'them',text:'Ты можешь отправить расписание?',time:'12:24'},{from:'mine',text:'Да, сейчас подготовлю.',time:'12:26'},{from:'them',text:'Спасибо большое!',time:'12:30'}]},
{id:'4',name:'Рабочая группа',type:'group',avatar:'Р',color:'yellow',preview:'Данияр: Собрание в 15:00',time:'11:15',unread:0,messages:[{from:'them',sender:'Гульнара',text:'Коллеги, доброе утро!',time:'10:50'},{from:'them',sender:'Данияр',text:'Собрание в 15:00',time:'11:15'}]},
{id:'5',name:'Данияр',username:'@daniyar',type:'private',avatar:'Д',color:'purple',preview:'Отправил документ',time:'Вчера',unread:0,messages:[{from:'them',text:'Отправил документ',time:'18:32'}]}];var activeId='1',filter='all';var colors={blue:'#6c83ed',green:'#31b79b',purple:'#9878df',yellow:'#e5a747',orange:'#ec8b76'};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function toast(s){var t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}
function renderList(){var q=$('#search').value.toLowerCase().trim(),shown=chats.filter(function(c){return(filter==='all'||c.type===filter)&&((c.name+' '+(c.username||'')+' '+c.preview).toLowerCase().includes(q))});$('#count').textContent=shown.length;$('#chatList').innerHTML=shown.map(function(c){return '<button class="chat-item '+(c.id===activeId?'active':'')+'" data-id="'+c.id+'"><div class="avatar '+c.color+'">'+esc(c.avatar)+'</div><div class="chat-info"><div class="chat-top"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+c.time+'</span></div><div class="preview">'+esc(c.preview)+' '+(c.unread?'<span class="unread">'+c.unread+'</span>':'')+'</div></div></button>'}).join('')||'<p style="color:var(--muted);padding:10px;font-size:13px">Ничего не найдено</p>';document.querySelectorAll('.chat-item').forEach(function(b){b.onclick=function(){openChat(b.dataset.id)}})}
function msgHTML(m,c){var mine=m.from==='mine',name=m.sender||c.name,color=m.sender==='Мама'?'orange':m.sender==='Данияр'?'purple':c.color;return '<div class="message-row '+(mine?'mine':'')+'">'+(mine?'':'<div class="mini-avatar" style="background:'+(colors[color]||colors.blue)+'">'+esc(name[0]||'?')+'</div>')+'<div class="message-content">'+(!mine&&c.type==='group'?'<div class="sender">'+esc(name)+'</div>':'')+'<div class="bubble">'+esc(m.text)+'</div><div class="msg-meta">'+m.time+(mine?' · ✓✓':'')+'</div></div></div>'}
function openChat(id){activeId=id;var c=chats.find(function(x){return x.id===id});if(!c)return;c.unread=0;$('#activeName').textContent=c.name;$('#activeAvatar').textContent=c.avatar;$('#activeAvatar').className='avatar '+c.color;$('#activeStatus').textContent=c.type==='group'?'группа · участники':(c.online?'● в сети':'был(а) недавно');$('#activeStatus').style.color=c.online?'var(--green)':'var(--muted)';$('#messages').innerHTML='<div class="day-label">Сегодня</div>'+c.messages.map(function(m){return msgHTML(m,c)}).join('');renderList();$('#app').classList.add('chat-mode');$('#conversation').classList.add('mobile-open');$('#messages').scrollTop=$('#messages').scrollHeight}
$('#messageForm').onsubmit=function(e){e.preventDefault();var input=$('#messageInput'),text=input.value.trim(),c=chats.find(function(x){return x.id===activeId});if(!text||!c)return;var time=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});c.messages.push({from:'mine',text:text,time:time});c.preview=text;c.time=time;input.value='';openChat(c.id)};$('#search').oninput=renderList;
document.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(function(x){x.classList.toggle('active',x===b)});document.querySelectorAll('.rail-btn[data-section]').forEach(function(x){x.classList.toggle('active',x.dataset.section===filter)});renderList()}});
document.querySelectorAll('[data-section]').forEach(function(b){b.onclick=function(){filter=b.dataset.section;document.querySelectorAll('[data-filter]').forEach(function(x){x.classList.toggle('active',x.dataset.filter===filter)});document.querySelectorAll('[data-section]').forEach(function(x){x.classList.toggle('active',x===b)});renderList();if(innerWidth<=650){$('#app').classList.remove('chat-mode');$('#conversation').classList.remove('mobile-open')}}});
$('#themeBtn').onclick=function(){document.body.classList.toggle('dark');$('#themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾'};$('#backBtn').onclick=function(){$('#app').classList.remove('chat-mode');$('#conversation').classList.remove('mobile-open')};$('#attachBtn').onclick=function(){toast('Загрузка файлов появится позже')};$('#infoBtn').onclick=function(){var c=chats.find(function(x){return x.id===activeId});toast(c.type==='group'?'Демонстрационная группа: '+c.name:'Демо-профиль '+(c.username||''))};$('#moreBtn').onclick=function(){toast('Дополнительные функции добавим позже')};$('#findBtn').onclick=function(){var q=prompt('Поиск в переписке');if(q)toast(chats.find(function(c){return c.id===activeId}).messages.some(function(m){return m.text.toLowerCase().includes(q.toLowerCase())})?'Сообщение найдено':'Совпадений нет')};$('#settingsBtn').onclick=function(){toast('Настройки профиля добавим позже')};
var backdrop=$('#backdrop');function showModal(group){$('#modalTitle').textContent=group?'Создать группу':'Новый личный чат';$('#modalDesc').textContent=group?'Укажи название новой группы.':'Введи уникальный логин собеседника.';$('#fields').innerHTML=group?'<label class="field"><span>Название группы</span><input name="name" required maxlength="50" placeholder="Например, Друзья"></label>':'<label class="field"><span>Логин пользователя</span><input name="username" required placeholder="@username"></label>';$('#submitBtn').textContent=group?'Создать группу':'Открыть чат';backdrop.dataset.group=group?'1':'0';backdrop.classList.add('show');setTimeout(function(){$('#fields input').focus()},50)}
$('#newBtn').onclick=function(){showModal(false)};document.querySelector('[data-section="group"]').ondblclick=function(){showModal(true)};$('#cancelBtn').onclick=function(){backdrop.classList.remove('show')};backdrop.onclick=function(e){if(e.target===backdrop)backdrop.classList.remove('show')};
$('#modalForm').onsubmit=function(e){e.preventDefault();var group=backdrop.dataset.group==='1',d=new FormData(e.target),name;if(group){name=String(d.get('name')).trim();if(!name)return;var c={id:String(Date.now()),name:name,type:'group',avatar:name[0].toUpperCase(),color:'purple',preview:'Группа создана',time:'сейчас',unread:0,messages:[{from:'them',sender:'QazChat',text:'Группа создана в демонстрационном макете.',time:'сейчас'}]};chats.unshift(c);filter='all';document.querySelectorAll('[data-filter]').forEach(function(x){x.classList.toggle('active',x.dataset.filter==='all')});openChat(c.id);toast('Группа создана в макете')}else{name=String(d.get('username')).trim().replace(/^@/,'');if(!name)return;var c=chats.find(function(x){return x.type==='private'&&x.username&&x.username.toLowerCase()==='@'+name.toLowerCase()});if(c){openChat(c.id);toast('Открыт демо-чат')}else{c={id:String(Date.now()),name:'@'+name,username:'@'+name,type:'private',avatar:name[0].toUpperCase(),color:'blue',preview:'Новый чат',time:'сейчас',unread:0,messages:[{from:'them',text:'Это демонстрационный чат. Для реальной переписки нужно подключить Firebase.',time:'сейчас'}]};chats.unshift(c);filter='all';renderList();openChat(c.id);toast('Чат создан в макете')}}backdrop.classList.remove('show');e.target.reset()};
renderList();openChat(activeId);
</script></body></html>
